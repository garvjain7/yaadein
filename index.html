<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaadein</title>
  <meta name="description" content="A quiet, time-of-day journey through everyday Indian childhood memories.">
  <meta name="theme-color" content="#1a130d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Background stage: two stacked layers that crossfade -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="bg" id="bg-a"></div>
    <div class="bg" id="bg-b"></div>
    <div class="shade"></div>
    <div class="grade"></div>
    <div class="grain"></div>
  </div>

  <!-- Floating interface (never moves during transitions) -->
  <main class="ui">
    <button class="fullscreen-btn" id="fullscreen-btn" type="button" aria-label="Enter fullscreen">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span id="fullscreen-label">Enter fullscreen</span>
    </button>
    <span class="visually-hidden" id="fullscreen-status" aria-live="polite"></span>

    <div class="presence" aria-label="People around the nook">
      <span class="presence-dot" aria-hidden="true"></span>
      <span id="presence-count">28</span>
      <span>around the nook</span>
    </div>

    <div class="clock" role="timer" aria-label="Your local time">
      <time id="clock-time">--:--:--</time>
    </div>

    <div class="text" id="text" aria-live="polite">
      <h1 class="title" id="title"></h1>
      <p class="caption" id="caption"></p>
    </div>

    <section class="radio-wrap" aria-label="Music player">
      <div class="radio" id="radio">
        <div class="player-cover" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 18V5l12-2v13M9 18c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2Zm12-2c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2ZM9 9l12-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="player-info">
          <span class="player-kicker">Yaadein radio</span>
          <strong class="player-title" id="radio-title">The radio is warming up</strong>
          <span class="player-subtitle" id="radio-status">Songs from another time are on their way</span>
          <span class="player-hint" id="radio-hint">Stay tuned</span>
        </div>
        <button class="radio-btn" id="radio-btn" type="button" aria-label="Open Spotify player" aria-expanded="false" aria-controls="spotify-panel" hidden>
          <svg class="player-open-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="player-close-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="spotify-panel" id="spotify-panel" hidden></div>
      </div>
    </section>

    <nav class="timeline" aria-label="Choose a moment of the day">
      <ol id="timeline"></ol>
      <button class="now-btn" id="now-btn" type="button" hidden>back to now</button>
      <div class="timeline-credits">
        <p>Inspired by Yash Bhardwaj's <a href="https://saloon.wtf">saloon.wtf</a></p>
        <p>Built with <span class="credit-heart" aria-hidden="true">♥ </span> by <a href="https://github.com/garvjain7" aria-label="Garv Jain">Garv Jain</a></p>
      </div>
    </nav>
  </main>

  <noscript><p class="noscript">This page needs JavaScript to show its scenes.</p></noscript>

  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
