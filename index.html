<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaadein</title>
  <meta name="description" content="A quiet, time-of-day journey through everyday Indian childhood memories.">
  <meta name="theme-color" content="#1a130d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Background stage: two stacked layers that crossfade -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="bg" id="bg-a"></div>
    <div class="bg" id="bg-b"></div>
    <div class="shade"></div>
    <div class="grade"></div>
    <div class="grain"></div>
  </div>

  <!-- Floating interface (never moves during transitions) -->
  <main class="ui">
    <button class="fullscreen-btn" id="fullscreen-btn" type="button" aria-label="Enter fullscreen">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span id="fullscreen-label">Enter fullscreen</span>
    </button>
    <span class="visually-hidden" id="fullscreen-status" aria-live="polite"></span>

    <div class="presence" aria-label="People around the nook">
      <span class="presence-dot" aria-hidden="true"></span>
      <span id="presence-count">28</span>
      <span>around the nook</span>
    </div>

    <div class="clock" role="timer" aria-label="Your local time">
      <time id="clock-time">--:--:--</time>
    </div>

    <div class="rotate-hint" id="rotate-hint" role="status" aria-live="polite">
      <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
        <path d="M11 8.5V5l-4 4 4 4V9.5h10a5 5 0 0 1 4.8 3.7M21 23.5V27l4-4-4-4v3.5H11a5 5 0 0 1-4.8-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="12" y="11" width="8" height="10" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span>Rotate your device for a better experience</span>
    </div>

    <div class="text" id="text" aria-live="polite">
      <h1 class="title" id="title"></h1>
      <p class="caption" id="caption"></p>
    </div>

    <section class="radio-wrap" aria-label="Music player">
      <div class="radio" id="radio">
        <!-- YouTube playback is controlled by the visible glass player. -->
        <div class="yt-frame" id="yt-frame"><div id="yt-player"></div></div>

        <div class="music-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 18V5l12-2v13M9 18c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2Zm12-2c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="player-now">
          <strong class="player-title" id="radio-title">Music</strong>
          <span class="player-subtitle" id="radio-status"></span>
        </div>
        <button class="ctl search-trigger" id="list-btn" type="button" aria-label="Search songs" aria-expanded="false" aria-controls="playlist-pop">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m15.5 15.5 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="player-controls" id="player-controls">
          <div class="player-progress">
            <span class="player-time" id="time-now">0:00</span>
            <input class="player-seek" id="seek" type="range" min="0" max="100" step="1" value="0" aria-label="Seek within song">
            <span class="player-time" id="time-total">0:00</span>
          </div>
          <div class="player-buttons">
            <button class="ctl" id="repeat-btn" type="button" aria-label="Repeat off" aria-pressed="false" data-mode="0">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="repeat-one" aria-hidden="true">1</span>
            </button>
            <button class="ctl" id="prev-btn" type="button" aria-label="Previous song">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg>
            </button>
            <button class="play-main" id="play-btn" type="button" aria-label="Play">
              <svg class="i-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
            </button>
            <button class="ctl" id="next-btn" type="button" aria-label="Next song">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>

        <div class="playlist-pop" id="playlist-pop" role="dialog" aria-label="Song list" hidden>
          <div class="playlist-head">
            <div>
              <strong>Find a song</strong>
              <span>26 songs · YouTube links needed to play</span>
            </div>
            <button class="ctl playlist-close" id="playlist-close" type="button" aria-label="Close song search">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <input class="song-search" id="song-search" type="search" placeholder="Search your songs" aria-label="Search songs" autocomplete="off">
          <ol class="playlist" id="playlist"></ol>
          <p class="playlist-empty" id="playlist-empty">No songs match your search.</p>
        </div>
      </div>
    </section>

    <nav class="timeline" aria-label="Choose a moment of the day">
      <ol id="timeline"></ol>
      <button class="now-btn" id="now-btn" type="button" hidden>back to now</button>
      <div class="timeline-credits">
        <p>Inspired by Yash Bhardwaj's <a href="https://saloon.wtf">saloon.wtf</a></p>
        <p>Built with <span class="credit-heart" aria-hidden="true">♥ </span> by <a href="https://github.com/garvjain7" aria-label="Garv Jain">Garv Jain</a></p>
      </div>
    </nav>
  </main>

  <noscript><p class="noscript">This page needs JavaScript to show its scenes.</p></noscript>

  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
